[tool.poetry]
name = "teste-torch"
version = "0.1.0"
description = "Teste de Poetry + torch em um no HTCondor"
authors = ["HTCondor tutorial"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
torch = { version = "*", source = "pytorch-cu126" }

# Wheels do torch com CUDA 12.6 (a maquina tem GPU NVIDIA, ver job4).
# Para a versao so CPU, troque a url por https://download.pytorch.org/whl/cpu
[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"
